{# app/templates/app/loginpartial.html #}
{% load static user_tags %}
{# Блок учёта пользователя в шапке — компактный, с безопасным обрезанием длинных имён #}

<div class="user-menu">
    {% if user.is_authenticated %}
    <div class="user-info">
        <form id="logoutForm" action="{% url 'logout' %}" method="post" class="logout-form">
            {% csrf_token %}
            <div class="user-row">
                <span class="nav-username" title="{{ user.username }}">{{ user.username }}</span>
                <button type="submit" class="btn btn-default btn-logout">Выйти</button>
            </div>
        </form>
    </div>
    {% else %}
    <div class="anon-links">
        <a class="btn btn-default" href="{% url 'login' %}?next={{ request.path }}">Войти</a>
    </div>
    {% endif %}
</div>
