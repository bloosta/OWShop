{% extends 'app/layout.html' %}
{% block title %}{{ product.title }}{% endblock %}
{% block content %}
<h1>{{ product.title }}</h1>
    {% if product.image %}
<img src="{{ product.image.url }}" alt="{{ product.title }}" style="max-width:300px;">
    {% endif %}
<p>{{ product.description|linebreaksbr }}</p>
<p>Цена: <strong>{{ product.price }} ₽</strong></p>
<p>В наличии: {{ product.stock }}</p>
<form method="post" action="{% url 'add_to_cart' product.slug %}">
    {% csrf_token %}
    <button type="submit" class="submit-button">Добавить в корзину</button>
</form>
{% endblock %}
